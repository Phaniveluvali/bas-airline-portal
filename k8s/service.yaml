apiVersion: v1
kind: Service
metadata:
  name: static-web-service
  namespace: bas
  labels:
    app: static-web
    app.kubernetes.io/name: bas-airline-portal
    app.kubernetes.io/managed-by: argocd
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: 80
    protocol: TCP
  selector:
    app: static-web
