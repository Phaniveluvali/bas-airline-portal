apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bas-airline-portal
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/name: bas-airline-portal
spec:
  project: default
  source:
    repoURL: https://github.com/Phaniveluvali/bas-airline-portal.git
    targetRevision: HEAD
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: bas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
